spring.application.name=swp391-racehorse-training-backend
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8082}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8082,http://127.0.0.1:8082}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration,classpath:db/{vendor}
spring.jpa.open-in-view=false

app.jwt.secret=${AUTH_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:30}
app.jwt.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
app.google.client-id=${GOOGLE_CLIENT_ID:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:horse-images}
app.head-trainer.injury-alert-heart-rate=${HEAD_TRAINER_INJURY_ALERT_HEART_RATE:220}
app.head-trainer.injury-alert-stamina=${HEAD_TRAINER_INJURY_ALERT_STAMINA:3}
app.head-trainer.injury-alert-speed-kmh=${HEAD_TRAINER_INJURY_ALERT_SPEED_KMH:74}
app.groom.assignment-window-days=${GROOM_ASSIGNMENT_WINDOW_DAYS:14}
