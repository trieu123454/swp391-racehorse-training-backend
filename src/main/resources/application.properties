spring.application.name=swp391-racehorse-training-backend
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${AUTH_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:30}
app.jwt.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
app.google.client-id=${GOOGLE_CLIENT_ID:}
